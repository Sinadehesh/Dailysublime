    .rebel-image-left:hover img,
    .rebel-image-right:hover img {
      transform: scale(1.08);
      filter: saturate(1) contrast(1.1);
    }

    /* Center Text Content - Refined typography */
    .rebel-text-center {
      padding: var(--space-xl) var(--space-lg);
      text-align: center;
      position: relative;
    }

    .rebel-text-center::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 1px;
      height: 60%;
      background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.3) 50%, transparent 100%);
    }

    .rebel-text-center::after {
      content: '';
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 1px;
      height: 60%;
      background: linear-gradient(180deg, transparent 0%, rgba(212, 175, 55, 0.3) 50%, transparent 100%);
    }

    .rebel-text-center p {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.35rem, 2.6vw, 1.65rem);
      font-weight: 400;
      font-style: italic;
      color: #ffffff;
      line-height: 2;
      margin-bottom: var(--space-xl);
      transition: all 0.5s ease;
      letter-spacing: 0.02em;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
    }

    .rebel-text-center p:hover {
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
    }

    .rebel-text-center p:first-of-type {
      font-size: clamp(1.4rem, 2.8vw, 1.75rem);
    }

    .rebel-text-center p:nth-of-type(2) {
      color: #f5ece0;
    }

    .rebel-text-center p:nth-of-type(3) {
      color: #ebe2d5;
    }

    .rebel-text-center p strong {
      color: #e5c866;
      font-weight: 600;
      font-style: normal;
      position: relative;
      transition: all 0.3s ease;
    }

    .rebel-text-center p strong::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--accent-gold);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.4s ease;
    }

    .rebel-text-center p:hover strong::after {
      transform: scaleX(1);
    }

    .rebel-text-center p:last-of-type {
      font-size: clamp(1.15rem, 2vw, 1.4rem);
      font-style: italic;
      color: rgba(212, 175, 55, 0.9);
      margin-top: var(--space-md);
      margin-bottom: 0;
    }

    /* CTA Button - Spectacular */
    .rebel-button-spectacular {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--bg-primary);
      background: var(--gradient-gold);
      padding: var(--space-md) var(--space-2xl);
      border-radius: var(--radius-full);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      transition: all 0.6s var(--ease-bounce);
      box-shadow: var(--shadow-lg), var(--glow-gold);
      position: relative;
      overflow: hidden;
      margin-top: var(--space-lg);
    }

    .rebel-button-spectacular::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-purple);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .rebel-button-spectacular:hover::before {
      opacity: 1;
    }

    .rebel-button-spectacular span {
      position: relative;
      z-index: 1;
    }

    .rebel-button-spectacular::after {
      content: '→';
      position: relative;
      z-index: 1;
      margin-left: var(--space-xs);
      transition: transform 0.4s var(--ease-bounce);
    }

    .rebel-button-spectacular:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: var(--shadow-xl), var(--glow-purple);
    }

    .rebel-button-spectacular:hover::after {
      transform: translateX(8px);
    }

    /* =====================================================
        CONTENT SECTIONS
        ===================================================== */
    .content-section {
      padding: var(--space-4xl) var(--space-lg);
      max-width: 1400px;
      margin: 0 auto;
    }

    .section-title {
      font-size: var(--fs-xl);
      text-align: center;
      margin-bottom: var(--space-3xl);
      background: linear-gradient(135deg, var(--text-main), var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* =====================================================
        FEATURES GRID
        ===================================================== */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-xl);
    }

    .feature-card {
      background: linear-gradient(145deg, var(--bg-card), var(--bg-elevated));
      border: var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-2xl);
      position: relative;
      overflow: hidden;
      transition: all 0.6s var(--ease-bounce);
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.6s var(--ease-out);
    }

    .feature-card:hover::before {
      transform: scaleX(1);
    }

    .feature-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-gold-subtle);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .feature-card:hover::after {
      opacity: 1;
    }

    .feature-card:hover {
      transform: translateY(-15px);
      border-color: var(--accent-gold);
      box-shadow: var(--shadow-lg), var(--glow-gold);
    }

    .feature-icon {
      width: 60px;
      height: 60px;
      background: var(--gradient-gold);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-lg);
      font-size: 1.5rem;
      transition: transform 0.5s var(--ease-bounce);
    }

    .feature-card:hover .feature-icon {
      transform: scale(1.1) rotate(5deg);
    }

    .feature-card h3 {
      font-size: var(--fs-md);
      color: var(--accent-gold);
      margin-bottom: var(--space-md);
      position: relative;
      z-index: 1;
    }

    .feature-card p {
      font-size: var(--fs-base);
      color: var(--text-secondary);
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }

    /* =====================================================
        PRICING SECTION
        ===================================================== */
    .pricing-section {
      background: var(--bg-surface);
      padding: var(--space-4xl) var(--space-lg);
    }

    .pricing-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-xl);
      align-items: stretch;
    }

    .pricing-card {
      background: linear-gradient(145deg, var(--bg-card), var(--bg-elevated));
      border: var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-2xl);
      text-align: center;
      transition: all 0.6s var(--ease-bounce);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .pricing-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-gold-subtle);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .pricing-card:hover::before {
      opacity: 1;
    }

    .pricing-card:hover {
      transform: translateY(-10px);
      box-shadow: var(--shadow-lg), var(--glow-gold);
      border-color: var(--accent-gold);
    }

    .pricing-card.featured {
      border-color: var(--accent-amber);
      transform: scale(1.05);
      box-shadow: var(--shadow-lg), var(--glow-amber);
      z-index: 1;
    }

    .pricing-card.featured:hover {
      transform: scale(1.08) translateY(-10px);
    }

    .pricing-badge {
      position: absolute;
      top: -1px;
      right: var(--space-lg);
      background: var(--gradient-amber);
      color: var(--bg-primary);
      padding: var(--space-xs) var(--space-md);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: var(--glow-amber);
    }

    .pricing-name {
      font-size: var(--fs-md);
      color: var(--text-main);
      margin-bottom: var(--space-sm);
      position: relative;
      z-index: 1;
    }

    .pricing-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 6vw, 4rem);
      font-weight: 500;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--space-xs);
      position: relative;
      z-index: 1;
    }

    .pricing-period {
      font-size: var(--fs-sm);
      color: var(--text-muted);
      margin-bottom: var(--space-lg);
      position: relative;
      z-index: 1;
    }

    .pricing-features {
      list-style: none;
      margin-bottom: var(--space-xl);
      text-align: left;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .pricing-features li {
      font-size: var(--fs-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-sm);
      padding-left: var(--space-lg);
      position: relative;
      transition: color 0.3s ease;
    }

    .pricing-features li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: var(--accent-gold);
      font-weight: bold;
    }

    .pricing-features li:hover {
      color: var(--text-main);
    }

    .pricing-button {
      width: 100%;
      font-size: var(--fs-base);
      font-weight: 600;
      color: var(--bg-primary);
      background: var(--gradient-gold);
      border: none;
      padding: var(--space-md) var(--space-xl);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all 0.5s var(--ease-bounce);
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 1;
    }

    .pricing-button:hover {
      transform: scale(1.05);
      box-shadow: var(--glow-gold);
    }

    .pricing-popularity {
      font-size: var(--fs-xs);
      color: var(--accent-emerald);
      font-weight: 600;
      margin-top: var(--space-sm);
      position: relative;
      z-index: 1;
    }

    /* =====================================================
        FOOTER
        ===================================================== */
    .site-footer {
      text-align: center;
      padding: var(--space-3xl) var(--space-lg);
      border-top: var(--border-subtle);
      background: var(--bg-primary);
    }

    .footer-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      margin-bottom: var(--space-md);
      transition: all 0.5s var(--ease-bounce);
    }

    .footer-logo:hover {
      transform: rotate(360deg);
      box-shadow: var(--glow-gold);
    }

    .footer-text {
      color: var(--text-muted);
      font-size: var(--fs-sm);
    }

    .footer-tagline {
      color: var(--accent-gold);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: var(--fs-base);
      margin-top: var(--space-xs);
    }

    .footer-legal {
      margin-top: var(--space-lg);
      padding-top: var(--space-md);
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      display: flex;
      justify-content: center;
      gap: var(--space-lg);
      flex-wrap: wrap;
    }

    .footer-legal a {
      color: var(--text-muted);
      font-size: var(--fs-xs);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-legal a:hover {
      color: var(--accent-gold);
    }

    /* =====================================================
        HOW IT WORKS SECTION - Premium Process
        ===================================================== */
    .how-it-works-section {
      padding: var(--space-4xl) var(--space-lg);
      background: var(--bg-surface);
      position: relative;
      overflow: hidden;
    }

    .how-it-works-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('images/tsunami-hokusai.webp');
      background-size: cover;
      background-position: center;
      opacity: 0.12;
      z-index: 0;
      animation: slowZoom 60s ease-in-out infinite alternate;
    }

    @keyframes slowZoom {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.1);
      }
    }

    .how-it-works-section::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--bg-surface) 0%, transparent 15%, transparent 85%, var(--bg-surface) 100%);
      z-index: 1;
    }

    .hiw-container {
      max-width: 1400px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* Enhanced section title for How It Works */
    .how-it-works-section .section-title {
      font-size: clamp(2rem, 5vw, 3rem);
      background: linear-gradient(135deg, var(--text-main), var(--accent-gold), var(--accent-purple), var(--text-main));
      background-size: 400% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleShimmer 10s ease-in-out infinite;
      position: relative;
      display: inline-block;
    }

    .how-it-works-section .section-title::after {
      content: '';
      position: absolute;
      bottom: -0.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      animation: underlineGlow 3s ease-in-out infinite;
    }

    .hiw-subtitle {
      font-size: var(--fs-md);
      color: var(--text-secondary);
      max-width: 600px;
      margin: -2rem auto var(--space-3xl);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
    }

    .hiw-subtitle-expanded {
      max-width: 800px;
      margin: var(--space-lg) auto var(--space-3xl);
      text-align: center;
      padding: var(--space-xl);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.03) 0%, transparent 50%, rgba(157, 124, 255, 0.03) 100%);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(212, 175, 55, 0.1);
      position: relative;
    }

    .hiw-subtitle-expanded::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      border-radius: 2px;
    }

    .hiw-subtitle-expanded p {
      font-size: var(--fs-base);
      color: var(--text-secondary);
      line-height: 1.9;
      margin-bottom: var(--space-md);
      transition: all 0.4s ease;
    }

    .hiw-subtitle-expanded p:hover {
      color: var(--text-main);
    }

    .hiw-subtitle-expanded p:first-child {
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);

      color: var(--accent-gold);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
    }

    .hiw-subtitle-expanded p:last-child {
      margin-bottom: 0;
    }

    .hiw-steps-wrapper {
      display: flex;
      justify-content: space-between;
      gap: var(--space-xl);
      position: relative;
      padding: var(--space-xl) 0;
    }

    /* Connector Line - Desktop - Animated */
    .hiw-connector-line {
      position: absolute;
      top: 4rem;
      left: 10%;
      right: 10%;
      height: 3px;
      background: linear-gradient(90deg,
          transparent,
          var(--accent-gold),
          var(--accent-purple),
          var(--accent-emerald),
          transparent);
      z-index: 0;
      opacity: 0.4;
      border-radius: 2px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .hiw-connector-line::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.8) 50%,
          transparent 100%);
      background-size: 200% 100%;
      animation: lineFlow 4s linear infinite;
      border-radius: 2px;
    }

    @keyframes lineFlow {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .hiw-card {
      flex: 1;
      position: relative;
      z-index: 1;
      perspective: 1000px;
    }

    .hiw-card-inner {
      background: linear-gradient(145deg, var(--bg-card), var(--bg-elevated));
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: var(--radius-lg);
      padding: 0;
      text-align: left;
      height: 100%;
      transition: all 0.6s var(--ease-bounce);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.3);
    }

    .hiw-card-inner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
          rgba(212, 175, 55, 0.05) 0%,
          transparent 40%,
          transparent 60%,
          rgba(157, 124, 255, 0.05) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .hiw-card:hover .hiw-card-inner::after {
      opacity: 1;
    }


    /* Painting Thumbnail - Enhanced */
    .hiw-painting {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      position: relative;
    }

    .hiw-painting::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
          rgba(212, 175, 55, 0.2) 0%,
          transparent 50%,
          rgba(157, 124, 255, 0.2) 100%);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 2;
      pointer-events: none;
    }

    .hiw-card:hover .hiw-painting::before {
      opacity: 1;
    }

    .hiw-painting img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s var(--ease-out), filter 0.6s ease;
      filter: saturate(0.85) brightness(0.95);
    }

    .hiw-card:hover .hiw-painting img {
      transform: scale(1.12);
      filter: saturate(1.15) brightness(1.05);
    }

    .hiw-painting::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .hiw-painting-caption {
      position: absolute;
      bottom: 0.75rem;
      left: 0.75rem;
      right: 0.75rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.9);
      font-style: italic;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      z-index: 3;
      transition: all 0.4s ease;
    }

    .hiw-card:hover .hiw-painting-caption {
      color: var(--accent-gold);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* Card Content Area - Enhanced */
    .hiw-card-content {
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.1) 100%);
    }

    /* Step Card Content */
    .hiw-step-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: var(--space-md);
    }

    /* Color Themes - Enhanced */
    .step-01 {
      --step-accent: #6366f1;
      --step-glow: rgba(99, 102, 241, 0.5);
      --step-gradient: linear-gradient(135deg, #6366f1, #818cf8);
    }

    .step-02 {
      --step-accent: #f59e0b;
      --step-glow: rgba(245, 158, 11, 0.5);
      --step-gradient: linear-gradient(135deg, #f59e0b, #fbbf24);
    }

    .step-03 {
      --step-accent: #10b981;
      --step-glow: rgba(16, 185, 129, 0.5);
      --step-gradient: linear-gradient(135deg, #10b981, #34d399);
    }

    /* Top Accent Border - Enhanced */
    .hiw-card-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--step-gradient);
      z-index: 10;
      transform: scaleX(0.2);
      transform-origin: center;
      transition: transform 0.6s var(--ease-out), box-shadow 0.4s ease;
    }

    .hiw-card:hover .hiw-card-inner::before {
      transform: scaleX(1);
      box-shadow: 0 0 20px var(--step-glow);
    }

    /* Number Badge - Enhanced with pulse */
    .hiw-number {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      background: var(--bg-card);
      border: 2px solid var(--step-accent);
      border-radius: 50%;
      width: 3.25rem;
      height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px var(--step-glow), var(--shadow-lg);
      z-index: 10;
      position: absolute;
      top: 1rem;
      right: 1rem;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .hiw-number::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid var(--step-accent);
      opacity: 0;
      animation: numberPulse 2s ease-in-out infinite;
    }

    @keyframes numberPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.6;
      }

      50% {
        transform: scale(1.2);
        opacity: 0;
      }
    }
